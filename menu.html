<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu</title>
<style>
:root{--bg:#121212;--card:#1b1b1b;--tx:#f4f1ea;--mut:#a9a49a;--gold:#e8b86a;--line:#3a3a3a;--red:#c8332b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf7f1;--card:#fff;--tx:#1c1a17;--mut:#6f6a60;--gold:#9a6a12;--line:#ddd5c5}}
:root[data-theme="light"]{--bg:#faf7f1;--card:#fff;--tx:#1c1a17;--mut:#6f6a60;--gold:#9a6a12;--line:#ddd5c5}
:root[data-theme="dark"]{--bg:#121212;--card:#1b1b1b;--tx:#f4f1ea;--mut:#a9a49a;--gold:#e8b86a;--line:#3a3a3a}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:28px 18px 8px;max-width:640px;margin:auto}
h1{margin:0;font-size:2rem;font-weight:800;letter-spacing:-.02em;color:var(--gold)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 18px}
nav a{flex:none;color:var(--tx);text-decoration:none;font-size:.85rem;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:99px}
nav a:focus-visible,nav a:hover{border-color:var(--gold);color:var(--gold);outline:none}
main{max-width:640px;margin:auto;padding:0 18px 40px}
section{padding-top:26px}
h2{margin:0 0 6px;font-size:1.35rem;color:var(--gold)}
h3{margin:18px 0 4px;font-size:1rem;color:var(--mut);font-weight:600}
.it{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dotted var(--line)}
.it b{font-weight:700}.it small{display:block;color:var(--mut);font-size:.8rem;font-weight:400}
.it .n{flex:1}.it .p{font-weight:800;color:var(--gold);white-space:nowrap}
.pp{display:flex;gap:6px}.pp span{font-size:.8rem;font-weight:700;border-radius:6px;padding:3px 8px;background:var(--red);color:#fff;white-space:nowrap}
.pp i{font-style:normal;font-size:.65rem;opacity:.85;margin-right:4px}
.note{color:var(--mut);font-size:.82rem;margin:6px 0}
.cta{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:10px;background:var(--gold);color:#111;font-weight:700;text-decoration:none}
footer{max-width:640px;margin:auto;padding:0 18px 30px;color:var(--mut);font-size:.8rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><h1>Menu</h1><p class="note">Prix en dirhams (DH).</p></header>
<nav id="nav"></nav>
<main id="m"></main>
<script>

</body>
</html>
